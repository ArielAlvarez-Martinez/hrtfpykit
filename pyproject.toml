[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrtfpykit"
dynamic = ["version"]
description = "hrtfpykit is a Python toolkit for working with Head Related Transfer Functions (HRTFs) stored in SOFA files. Around that core, it creates an ecosystem of tools for HRTF research and dataset pipelines creation"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Ariel Alvarez-Martinez", email = "aalvmarprojects@gmail.com"}]
maintainers = [{name = "Ariel Alvarez-Martinez", email = "aalvmarprojects@gmail.com"}]
keywords = [
  "audio",
  "research",
  "deep-learning",
  "hrtf",
  "spatial-audio",
  "audio-processing",
  "science-research",
  "hrtf-individualization",
  "pytorch-dataset",
  "hrtfs",
  "sofa",
  "datasets",
]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=2.3.5",
  "scipy>=1.17.1",
  "matplotlib>=3.10.7",
  "netCDF4>=1.7.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.2",
]
docs = [
  "sphinx>=9.1.0",
  "furo>=2025.7.19",
]

[project.urls]
Homepage = "https://github.com/ArielAlvarez-Martinez/hrtfpykit"
Repository = "https://github.com/ArielAlvarez-Martinez/hrtfpykit.git"
Issues = "https://github.com/ArielAlvarez-Martinez/hrtfpykit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hrtfpykit*"]

[tool.setuptools.dynamic]
version = { attr = "hrtfpykit.__version__" }
