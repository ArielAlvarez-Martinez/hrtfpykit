[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hrtfpykit"
version = "0.0.6"
description = "hrtfpykit is a Python toolkit for working with Head Related Transfer Functions (HRTFs) stored in SOFA files. Around that core, it creates an ecosystem of tools for HRTF research and dataset pipelines creation"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Ariel Alvarez-Martinez", email = "aalvmarprojects@gmail.com"}]
maintainers = [{name = "Ariel Alvarez-Martinez", email = "aalvmarprojects@gmail.com"}]
keywords = [
  "audio",
  "research",
  "deep-learning",
  "hrtf",
  "spatial-audio",
  "audio-processing",
  "science-research",
  "hrtf-individualization",
  "pytorch-dataset",
  "hrtfs",
  "sofa",
  "datasets",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=2.3.5",
  "scipy>=1.17.1",
  "matplotlib>=3.10.7",
  "netCDF4>=1.7.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.2",
]
docs = [
  "sphinx>=9.1.0",
  "furo>=2025.7.19",
  "myst-nb>=1.4.0",
]
dev = [
  "mypy>=1.20.2",
  "ruff>=0.15.12",
]

[project.urls]
Homepage = "https://github.com/ArielAlvarez-Martinez/hrtfpykit"
Repository = "https://github.com/ArielAlvarez-Martinez/hrtfpykit.git"
Issues = "https://github.com/ArielAlvarez-Martinez/hrtfpykit/issues"
Changelog = "https://github.com/ArielAlvarez-Martinez/hrtfpykit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["hrtfpykit*"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  "build",
  "dist",
  "docs/_build",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
files = ["hrtfpykit"]
ignore_missing_imports = true
show_error_codes = true
pretty = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
