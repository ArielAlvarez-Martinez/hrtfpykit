[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hrtfpykit"
version = "0.2.1.dev0"
description = "A Python library for complete HRTF workflows, from SOFA file inspection and acoustic processing to visualization, comparison, and reproducible dataset pipelines construction."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Ariel Alvarez-Martinez", email = "aalvmarprojects@gmail.com"}, { name = "Jose J. Lopez", email = "jjlopez@dcom.upv.es"}]
maintainers = [{name = "Ariel Alvarez-Martinez", email = "aalvmarprojects@gmail.com"}]
keywords = [
  "audio",
  "research",
  "deep-learning",
  "hrtf",
  "spatial-audio",
  "audio-processing",
  "science-research",
  "hrtf-individualization",
  "pytorch-dataset",
  "hrtfs",
  "sofa",
  "datasets",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=2.3.5",
  "scipy>=1.17.1",
  "matplotlib>=3.10.7",
  "netCDF4>=1.7.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.2",
]
docs = [
  "sphinx>=9.1.0",
  "furo>=2025.7.19",
  "myst-nb>=1.4.0",
  "sphinx-copybutton>=0.5.2",
]
dev = [
  "mypy>=1.20.2",
  "ruff>=0.15.12",
]

[project.urls]
Documentation = "https://hrtfpykit.readthedocs.io/"
Repository = "https://github.com/ArielAlvarez-Martinez/hrtfpykit.git"
Issues = "https://github.com/ArielAlvarez-Martinez/hrtfpykit/issues"
Changelog = "https://github.com/ArielAlvarez-Martinez/hrtfpykit/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hrtfpykit*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "build",
  "dist",
  "docs/_build",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["src/hrtfpykit"]
ignore_missing_imports = true
show_error_codes = true
pretty = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
