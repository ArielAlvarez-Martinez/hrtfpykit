[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrtfpykit"
dynamic = ["version"]
description = "Python toolkit for SOFA-backed HRTF workflows: dataset construction, acoustic transforms, metrics, and visualization"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Ariel Alvarez-Martinez" }]
keywords = ["audio", "hrtf", "sofa", "spatial-audio"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=2.3.5",
  "scipy>=1.17.1",
  "matplotlib>=3.10.7",
  "netCDF4>=1.7.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.2",
]
docs = [
  "sphinx>=9.1.0",
  "furo>=2025.7.19",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hrtfpykit*"]

[tool.setuptools.dynamic]
version = { attr = "hrtfpykit.__version__" }
