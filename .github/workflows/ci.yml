name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/hrtfpykit tests

      - name: Type check with mypy
        run: mypy src/hrtfpykit

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: >
          python -m pytest -q
          tests/test_sofa.py
          tests/test_hrtf.py
          tests/test_plots.py
          tests/test_integration.py
          tests/test_hutubs.py::test_hutubs_config_subject_ids_are_valid
          tests/test_hutubs.py::test_hutubs_config_subject_exclusions
          tests/test_hutubs.py::test_hutubs_hrtf_download_plan_variants
          tests/test_hutubs.py::test_hutubs_download_plan_follows_subject_limit
          tests/test_hutubs.py::test_hutubs_missing_checksum_fails_download_plan
          tests/test_hutubs.py::test_hutubs_checksum_mismatch_fails
          tests/test_hutubs.py::test_hutubs_invalid_variant_keys_are_rejected
          tests/test_hutubs.py::test_hutubs_spec_workflow_does_not_mutate_spec_objects
          tests/test_hutubs.py::test_hutubs_anthropometry_download_plan
          tests/test_sonicom.py::test_sonicom_config_subject_ids_are_valid
          tests/test_sonicom.py::test_sonicom_config_subject_exclusions
          tests/test_sonicom.py::test_sonicom_hrtf_download_plan_variants
          tests/test_sonicom.py::test_sonicom_download_plan_follows_subject_limit
          tests/test_sonicom.py::test_sonicom_missing_checksum_fails_download_plan
          tests/test_sonicom.py::test_sonicom_checksum_mismatch_fails
          tests/test_sonicom.py::test_sonicom_invalid_variant_keys_are_rejected
          tests/test_sonicom.py::test_sonicom_spec_workflow_does_not_mutate_spec_objects
          tests/test_sonicom.py::test_sonicom_metadata_download_plan
          tests/test_sonicom.py::test_sonicom_windowed_checksums_cover_default_sample_rates
          tests/test_ari.py::test_ari_config_subject_ids_are_valid
          tests/test_ari.py::test_ari_config_subject_exclusions
          tests/test_ari.py::test_ari_hrtf_download_plan
          tests/test_ari.py::test_ari_download_plan_follows_subject_limit
          tests/test_ari.py::test_ari_missing_checksum_fails_download_plan
          tests/test_ari.py::test_ari_checksum_mismatch_fails
          tests/test_ari.py::test_ari_invalid_download_variant_keys_are_rejected
          tests/test_ari.py::test_ari_spec_workflow_does_not_mutate_spec_objects
          tests/test_ari.py::test_ari_anthropometry_download_plan
          tests/test_ari.py::test_ari_metadata_download_plan

