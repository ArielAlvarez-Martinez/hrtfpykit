<a class="sidebar-brand{% if logo %} centered{% endif %}" href="{{ pathto(master_doc) }}">
  {%- block brand_content %}
  {%- if logo_url %}
  <div class="sidebar-logo-container">
    <img class="sidebar-logo" src="{{ logo_url }}" alt="Logo"/>
  </div>
  {%- endif %}
  {%- if theme_light_logo and theme_dark_logo %}
  <div class="sidebar-logo-container">
    <img class="sidebar-logo only-light" src="{{ pathto('_static/' + theme_light_logo, 1) }}" alt="Light Logo"/>
    <img class="sidebar-logo only-dark" src="{{ pathto('_static/' + theme_dark_logo, 1) }}" alt="Dark Logo"/>
  </div>
  {%- endif %}
  {% if not theme_sidebar_hide_name %}
  <span class="sidebar-brand-text">{{ docstitle if docstitle else project }}</span>
  {%- endif %}
  {% endblock brand_content %}
</a>
<div class="sidebar-project-links" aria-label="Project links">
  <a
    class="sidebar-author-link"
    href="https://github.com/ArielAlvarez-Martinez"
    rel="noopener noreferrer"
    target="_blank"
  >
    by aalvmar
  </a>
  <span class="sidebar-project-separator">:</span>
  <a
    class="sidebar-project-link"
    href="https://github.com/ArielAlvarez-Martinez/hrtfpykit"
    rel="noopener noreferrer"
    target="_blank"
    title="GitHub repository"
    aria-label="GitHub repository"
  >
    <img
      src="{{ pathto('_static/icons/github.svg', 1) }}"
      alt=""
      aria-hidden="true"
    />
  </a>
  <a
    class="sidebar-project-link"
    href="https://pypi.org/project/hrtfpykit/"
    rel="noopener noreferrer"
    target="_blank"
    title="hrtfpykit on PyPI"
    aria-label="hrtfpykit on PyPI"
  >
    <img
      src="{{ pathto('_static/icons/pypi.svg', 1) }}"
      alt=""
      aria-hidden="true"
    />
  </a>
</div>
